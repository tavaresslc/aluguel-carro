# Ajustes de logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.br.com.carrent=INFO

# Segurança
app.security.token-secret=${TOKEN_SECRET}

# Seeds
app.seed.banco.nome=${SEED_BANCO_NOME}
app.seed.banco.email=${SEED_BANCO_EMAIL}
app.seed.banco.senha=${SEED_BANCO_SENHA}
app.seed.empresa.nome=${SEED_EMPRESA_NOME}
app.seed.empresa.email=${SEED_EMPRESA_EMAIL}
app.seed.empresa.senha=${SEED_EMPRESA_SENHA}