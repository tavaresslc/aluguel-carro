spring.application.name=carrent
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# Respostas de erro em JSON
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.db.pool-max-size=${DB_POOL_MAX:5}
app.db.pool-min-idle=${DB_POOL_MIN_IDLE:1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Segurança
app.security.token-expiration-minutes=${TOKEN_EXPIRATION_MINUTES:480}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}