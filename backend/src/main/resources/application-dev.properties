# Ativação de Logs SQL e Debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.br.com.carrent=DEBUG

# Segurança
app.security.token-secret=${TOKEN_SECRET:dev-only-secret-change-me-0123456789-abcdef}

# Seeds
app.seed.banco.nome=${SEED_BANCO_NOME:Banco Carrent}
app.seed.banco.email=${SEED_BANCO_EMAIL:banco@carrent.dev}
app.seed.banco.senha=${SEED_BANCO_SENHA:Banco@12345}
app.seed.empresa.nome=${SEED_EMPRESA_NOME:Empresa Carrent}
app.seed.empresa.email=${SEED_EMPRESA_EMAIL:empresa@carrent.dev}
app.seed.empresa.senha=${SEED_EMPRESA_SENHA:Empresa@12345}